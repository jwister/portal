services:
  portal:
    image: ${PORTAL_IMAGE:?Set PORTAL_IMAGE to an exact published version, such as wenyou7/ztoken-portal:0.1.0}
    container_name: ztoken-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8084}:8084"
    environment:
      PORTAL_PORT: "8084"
      PORTAL_DB_URL: ${PORTAL_DB_URL:?Set PORTAL_DB_URL for the external MySQL database}
      PORTAL_DB_USERNAME: ${PORTAL_DB_USERNAME:?Set PORTAL_DB_USERNAME}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?Set PORTAL_DB_PASSWORD}
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:?Set PORTAL_SESSION_KEY}
      PORTAL_SESSION_TTL: ${PORTAL_SESSION_TTL:-7d}
      PORTAL_SESSION_SECURE_COOKIE: ${PORTAL_SESSION_SECURE_COOKIE:-true}
      PORTAL_NEW_API_BASE_URL: ${PORTAL_NEW_API_BASE_URL:?Set PORTAL_NEW_API_BASE_URL}
      PORTAL_NEW_API_PRICING_TOKEN: ${PORTAL_NEW_API_PRICING_TOKEN:?Set PORTAL_NEW_API_PRICING_TOKEN}
      PAYMENT_ORDER_EXPIRY_MINUTES: ${PAYMENT_ORDER_EXPIRY_MINUTES:-30}
      PAYMENT_QUOTA_PER_USD: ${PAYMENT_QUOTA_PER_USD:-500000}
      PAYMENT_PAYPAL_MODE: ${PAYMENT_PAYPAL_MODE:-sandbox}
      PAYMENT_PAYPAL_CLIENT_ID: ${PAYMENT_PAYPAL_CLIENT_ID:-}
      PAYMENT_PAYPAL_CLIENT_SECRET: ${PAYMENT_PAYPAL_CLIENT_SECRET:-}
      PAYMENT_PAYPAL_WEBHOOK_ID: ${PAYMENT_PAYPAL_WEBHOOK_ID:-}
      PAYMENT_NEWAPI_CREDIT_ACCESS_TOKEN: ${PAYMENT_NEWAPI_CREDIT_ACCESS_TOKEN:?Set PAYMENT_NEWAPI_CREDIT_ACCESS_TOKEN}
      PAYMENT_NEWAPI_CREDIT_MAX_WALLET_QUOTA: ${PAYMENT_NEWAPI_CREDIT_MAX_WALLET_QUOTA:-2147483647}
      PAYMENT_TRC20_USDT_CONTRACT: ${PAYMENT_TRC20_USDT_CONTRACT:-TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
      PAYMENT_TRC20_CONFIRMATION_COUNT: ${PAYMENT_TRC20_CONFIRMATION_COUNT:-20}
      PAYMENT_TRC20_AMOUNT_SUFFIX_ENABLED: ${PAYMENT_TRC20_AMOUNT_SUFFIX_ENABLED:-true}
      PAYMENT_TRC20_TXID_RETRY_FIXED_DELAY_MS: ${PAYMENT_TRC20_TXID_RETRY_FIXED_DELAY_MS:-5000}
      PAYMENT_TRC20_ORDER_EXPIRY_FIXED_DELAY_MS: ${PAYMENT_TRC20_ORDER_EXPIRY_FIXED_DELAY_MS:-5000}
      PAYMENT_TRC20_TRONGRID_BASE_URL: ${PAYMENT_TRC20_TRONGRID_BASE_URL:-https://api.trongrid.io}
      PAYMENT_TRC20_TRONGRID_API_KEY: ${PAYMENT_TRC20_TRONGRID_API_KEY:?Set PAYMENT_TRC20_TRONGRID_API_KEY}
      PAYMENT_TRC20_ADDRESSES: ${PAYMENT_TRC20_ADDRESSES:?Set PAYMENT_TRC20_ADDRESSES as a comma-separated address pool}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
