name: 发布 Portal Docker 镜像

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码与标签
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 预约发布版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          existing_tag="$(git tag --points-at HEAD --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            version="${existing_tag#v}"
            release_exists=true
          else
            existing_reservation="$(git tag --points-at HEAD --list 'ci/release/v[0-9]*' | sed -nE 's#^ci/release/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -n 1 || true)"
            if [[ -n "$existing_reservation" ]]; then
              version="$existing_reservation"
            else
              reserved=false
              for attempt in {1..10}; do
                git fetch --tags --force
                latest_version="$( {
                  git tag --list 'v[0-9]*' | sed -nE 's#^v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p'
                  git tag --list 'ci/release/v[0-9]*' | sed -nE 's#^ci/release/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p'
                } | sort -V | tail -n 1 || true)"
                if [[ -z "$latest_version" ]]; then
                  version="0.1.0"
                else
                  IFS='.' read -r major minor patch <<< "$latest_version"
                  version="$major.$minor.$((patch + 1))"
                fi

                reservation_tag="ci/release/v$version"
                if git ls-remote --exit-code --tags origin "refs/tags/$reservation_tag" >/dev/null 2>&1; then
                  continue
                fi

                git tag "$reservation_tag" "$GITHUB_SHA"
                if git push origin "refs/tags/$reservation_tag"; then
                  reserved=true
                  break
                fi
                git tag -d "$reservation_tag"
              done

              if [[ "$reserved" != true ]]; then
                echo "未能预约唯一发布版本，请重新运行工作流。" >&2
                exit 1
              fi
            fi
            release_exists=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: 配置 Docker Buildx
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.0.0

      - name: 登录 Docker Hub
        if: steps.version.outputs.release_exists != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 检查现有镜像版本
        id: image
        if: steps.version.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="wenyou7/ztoken-portal:${{ steps.version.outputs.version }}"
          inspection_error="$(mktemp)"
          trap 'rm -f "$inspection_error"' EXIT

          if labels="$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "$image" 2>"$inspection_error")"; then
            image_revision="$(jq -r '."org.opencontainers.image.revision" // empty' <<< "$labels")"
            image_version="$(jq -r '."org.opencontainers.image.version" // empty' <<< "$labels")"
            if [[ "$image_revision" != "$GITHUB_SHA" || "$image_version" != "${{ steps.version.outputs.version }}" ]]; then
              echo "Docker Hub 镜像标签 $image 已被其他发布占用，拒绝覆盖。" >&2
              exit 1
            fi
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown|name unknown' "$inspection_error"; then
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$inspection_error" >&2
            echo "无法确认 Docker Hub 镜像标签 $image 的状态，已停止发布。" >&2
            exit 1
          fi

      - name: 构建 Portal JAR
        if: steps.version.outputs.release_exists != 'true' && steps.image.outputs.image_exists != 'true'
        run: mvn -B -f backend/pom.xml clean package

      - name: 构建并推送版本镜像
        if: steps.version.outputs.release_exists != 'true' && steps.image.outputs.image_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          push: true
          tags: wenyou7/ztoken-portal:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: 推送发布标签
        if: steps.version.outputs.release_exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.git_tag }}" -m "发布 Portal 镜像 ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.git_tag }}"
