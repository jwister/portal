spring:
  application:
    name: ztoken-portal
  datasource:
    url: ${PORTAL_DB_URL:jdbc:mysql://localhost:3306/ztoken_portal?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${PORTAL_DB_USERNAME:}
    password: ${PORTAL_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORTAL_PORT:8080}
portal:
  session-key: ${PORTAL_SESSION_KEY:}
  session-ttl: ${PORTAL_SESSION_TTL:7d}
  session-secure-cookie: ${PORTAL_SESSION_SECURE_COOKIE:false}
  new-api:
    base-url: ${NEWAPI_BASE_URL:http://localhost:3005}
payment:
  order-expiry-minutes: ${PAYMENT_ORDER_EXPIRY_MINUTES:30}
  quota-per-usd: ${PAYMENT_QUOTA_PER_USD:500000}
  paypal:
    mode: ${PAYMENT_PAYPAL_MODE:sandbox}
    client-id: ${PAYMENT_PAYPAL_CLIENT_ID:}
    client-secret: ${PAYMENT_PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYMENT_PAYPAL_WEBHOOK_ID:}
  newapi-credit:
    access-token: ${PAYMENT_NEWAPI_CREDIT_ACCESS_TOKEN:}
    max-wallet-quota: ${PAYMENT_NEWAPI_CREDIT_MAX_WALLET_QUOTA:2147483647}
